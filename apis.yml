name: CMR Surgical
description: 'CMR Surgical is a British medical-device company headquartered in Cambridge, UK, founded in
  2014 (as Cambridge Medical Robotics). It develops Versius, a small, modular and portable robot-assisted
  surgical system used across urology, general, gynaecological and thoracic surgery, and Versius Plus, its
  next-generation platform cleared by the US FDA in December 2025. More than 45,000 patients have been treated
  globally, making Versius one of the most widely used soft-tissue robotic surgery platforms. CMR reached
  unicorn status in 2019 and raised a $600M Series D at a $3B valuation in 2021, backed by SoftBank Vision
  Fund 2, GE Healthcare, ABB Technology Ventures and others. Its digital ecosystem (Versius Connect, Versius
  Team, Versius Clinical Insights) is a login-gated clinical surface; CMR publishes no public developer API,
  OpenAPI, SDKs or developer portal.'
